mcb([['Как называется слово с несколькими значениями?','многозначное',['однозначное','заимствованное','устаревшее'],'Лексикология.'],['Что изучает лексикология?','словарный состав языка и значения слов',['звуки речи','строение слова','знаки препинания'],'Лексикология.'],['Что такое фразеологизм?','устойчивое сочетание слов с цельным значением',['любое словосочетание','слово с приставкой','предложение с обращением'],'Фразеология.']])],

const mk=id=>{const r=pk(G[id])();r.t=id;
if(r.c){r.type='ms';r.opts=r.o;r.cs=r.opts.map((o,i)=>r.c.includes(o)?i:-1).filter(i=>i>=0)}
else if(r.x!==undefined)r.type='txt';
else if(r.o){r.type='mc';if(r.fix&&!r._sh){r.opts=r.o;r.ci=r.ci0}else{r.opts=sh(r.o);r.ci=r.opts.indexOf(r.o[0])}}
else r.type='num';return r};
const $=s=>document.querySelector(s);
const load=()=>{try{return JSON.parse(localStorage.getItem('ru9_1'))||{t:{},h:[]}}catch(e){return{t:{},h:[]}}};
let ST=load(),S=null;const save=()=>{try{localStorage.setItem('ru9_1',JSON.stringify(ST))}catch(e){}};
const acc=id=>{const t=ST.t[id];return t&&t.ok+t.bad?Math.round(t.ok/(t.ok+t.bad)*100):null};
const col=p=>p===null?'var(--bd)':p>=75?'var(--ok)':p>=50?'#e0a030':'var(--bad)';
function home(){S=null;let h=`<h1>Тренажёр · Русский язык 9 класс</h1><p class="m">По учебнику Л. А. Тростенцовой, Т. А. Ладыженской и др. Задания в формате ОГЭ: запятые, виды предложений, орфография, ударения. Каждый раз новые задания и порядок 🙂</p>
<button class="big card" onclick="start('mix')">🎯 Случайный микс — 10 заданий из всех тем</button>
<button class="big card" onclick="start('test')">📝 Пробный тест — 15 заданий, без подсказок, результат в конце</button>
<button class="big card" onclick="start('weak')">🔁 Работа над ошибками — чаще попадаются слабые темы</button>
<button class="big card" onclick="stats()">📊 Статистика и аналитика</button><h2>Тренировка по темам</h2><div class="grid">`;
T.forEach(t=>{const a=acc(t.id);h+=`<button class="tc" onclick="start('topic','${t.id}')"><b>${t.i} ${t.n}</b><small>${t.s}</small><div class="rb" style="margin-top:8px"><span style="width:auto">${a===null?'ещё нет данных':a+'%'}</span><span class="t"><i style="width:${a||0}%;background:${col(a)}"></i></span></div></button>`});
$('#app').innerHTML=h+'</div>'}
function start(mode,id){const N=mode==='test'?15:10;let ids=[];
if(mode==='topic')ids=Array(N).fill(id);
else if(mode==='weak'){const w=T.map(t=>{const a=acc(t.id);return[t.id,a===null?.5:1.1-a/100]});const sum=w.reduce((s,x)=>s+x[1],0);for(let i=0;i<N;i++){let r=Math.random()*sum;for(const x of w){r-=x[1];if(r<=0){ids.push(x[0]);break}}}while(ids.length<N)ids.push(pk(T).id)}
else{ids=sh(T.map(t=>t.id));while(ids.length<N)ids.push(pk(T).id);ids=sh(ids).slice(0,N)}
const seen=new Set(),qs=[];for(const i of ids){let q,n=0;do{q=mk(i)}while(seen.has(q.q+(q.opts?q.opts.join():''))&&++n<40);seen.add(q.q+(q.opts?q.opts.join():''));qs.push(q)}
S={mode,id,qs,i:0,res:[],locked:false,hu:false,sel:-1,ms:[]};qv()}
function qv(){const q=S.qs[S.i],test=S.mode==='test',n=S.qs.length,tp=T.find(t=>t.id===q.t);S.hu=false;S.sel=-1;S.ms=[];
const body=q.type==='mc'?q.opts.map((o,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})">${esc(o)}</button>`).join(''):q.type==='ms'?'<div class="sub">Выберите все верные варианты</div>'+'<div class="row" style="margin:0 0 10px">'+q.opts.map((o,k)=>`<button class="opt" style="width:auto;min-width:54px;text-align:center;margin:0" id="o${k}" onclick="tog(${k})">${esc(o)}</button>`).join('')+'</div>':(q.type==='num'?'<input id="ans" inputmode="numeric" autocomplete="off" placeholder="Ответ — число">':'<input id="ans" autocomplete="off" placeholder="Введите ответ">');
$('#app').innerHTML=`<div class="top"><button class="g" onclick="if(confirm('Выйти? Ответы уже сохранены в статистике.'))home()">← Меню</button><span>${S.i+1} / ${n}${test?' · тест':''}</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
<div class="card"><div class="tag">${tp.i} ${tp.n}</div><div class="q">${q.q}</div>${body}
<div id="hint" class="hint" hidden></div><div class="row">${test?'':'<button class="g" onclick="hint()">💡 Подсказка</button>'}<button class="p" id="chk" onclick="check()">${test?'Ответить':'Проверить'}</button></div><div id="fb"></div></div>`;
const a=$('#ans');if(a){a.focus();a.onkeydown=e=>{if(e.key==='Enter')check()}}}
function pick(k){if(S.locked)return;S.sel=k;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===k))}
function tog(k){if(S.locked)return;const i=S.ms.indexOf(k);i<0?S.ms.push(k):S.ms.splice(i,1);$('#o'+k).classList.toggle('sel',i<0)}
function hint(){if(S.locked)return;const h=$('#hint');h.hidden=false;h.innerHTML='💡 '+S.qs[S.i].h;S.hu=true}
function check(){if(S.locked)return;const q=S.qs[S.i],test=S.mode==='test';let ok,user,cor;
if(q.type==='mc'){if(S.sel<0)return;ok=S.sel===q.ci;user=q.opts[S.sel];cor=q.opts[q.ci]}
else if(q.type==='ms'){if(!S.ms.length)return;ok=S.ms.slice().sort().join()===q.cs.slice().sort().join();user=S.ms.map(i=>q.opts[i]).join(', ');cor=q.cs.map(i=>q.opts[i]).join(', ')}
else if(q.type==='txt'){const raw=$('#ans').value;if(!raw.trim())return;ok=nm(raw)===nm(q.x);user=raw.trim();cor=q.x}
else{const raw=$('#ans').value;if(!raw.trim())return;const x=parseFloat(raw.replace(/\s/g,'').replace(',','.').replace('−','-'));ok=isFinite(x)&&Math.abs(x-q.a)<1e-6;user=raw.trim();cor=F(q.a)}
S.res.push({q,ok,user,cor,hu:S.hu});
const t=ST.t[q.t]||(ST.t[q.t]={ok:0,bad:0,h:0});ok?t.ok++:t.bad++;if(S.hu)t.h++;save();
if(test){nextQ();return}
S.locked=true;
if(q.type==='mc')document.querySelectorAll('.opt').forEach((b,i)=>{if(i===q.ci)b.classList.add('ok');else if(i===S.sel)b.classList.add('no')});
else if(q.type==='ms')document.querySelectorAll('.opt').forEach((b,i)=>{const c=q.cs.includes(i),s=S.ms.includes(i);if(c)b.classList.add('ok');else if(s)b.classList.add('no')});
else $('#ans').disabled=true;
$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ Верно!'+(S.hu?' (с подсказкой)':''):'❌ Неверно. Правильный ответ: '+esc(cor)}</b><br><small>${q.e}</small></div>`;
const c=$('#chk');c.textContent=S.i+1>=S.qs.length?'Результат →':'Дальше →';c.onclick=nextQ}
function nextQ(){S.locked=false;S.i++;S.i>=S.qs.length?finish():qv()}
function finish(){const ok=S.res.filter(r=>r.ok).length,n=S.res.length;ST.h.push({ts:Date.now(),m:S.mode,ok,n});ST.h=ST.h.slice(-30);save();
const p=Math.round(ok/n*100),errs=S.res.filter(r=>!r.ok),test=S.mode==='test';
let h=`<div class="card" style="text-align:center"><div class="m">Результат</div><div class="big2" style="color:${col(p)}">${ok} из ${n} · ${p}%</div>${test?`<div class="m">Ориентировочная оценка: <b>${p>=85?5:p>=65?4:p>=40?3:2}</b></div>`:''}<div class="row"><button class="p" onclick="start('${S.mode}',${S.id?`'${S.id}'`:'null'})">Ещё раз (новые задания)</button><button onclick="home()">В меню</button></div></div>`;
if(errs.length)h+='<h2>Разбор ошибок</h2><div class="card">'+errs.map(r=>`<div class="err"><div>${r.q.q}</div><small>Твой ответ: ${esc(r.user)} · Правильно: <b>${esc(r.cor)}</b><br>${r.q.e}</small></div>`).join('')+'</div>';
else h+='<p class="m" style="text-align:center">Без ошибок! 🎉</p>';
$('#app').innerHTML=h}
function stats(){let ok=0,bad=0,hh=0;Object.values(ST.t).forEach(t=>{ok+=t.ok;bad+=t.bad;hh+=t.h});const n=ok+bad,p=n?Math.round(ok/n*100):0;
let h=`<div class="top"><button class="g" onclick="home()">← Меню</button><b>Статистика</b><span></span></div>`;
if(!n)return $('#app').innerHTML=h+'<div class="card m">Пока нет данных — ответьте на несколько заданий.</div>';
h+=`<div class="card" style="text-align:center"><div class="big2" style="color:${col(p)}">${p}%</div><div class="m">верных ответов · всего ${n} (✅ ${ok} / ❌ ${bad}) · с подсказкой: ${hh}</div></div><h2>По темам</h2><div class="card">`;
const rows=T.map(t=>({t,a:acc(t.id),d:ST.t[t.id]||{ok:0,bad:0,h:0}}));
rows.forEach(r=>{h+=`<div class="rb"><span>${r.t.i} ${r.t.n}</span><span class="t"><i style="width:${r.a||0}%;background:${col(r.a)}"></i></span><span style="width:84px;text-align:right">${r.a===null?'—':r.a+'% ('+r.d.ok+'/'+(r.d.ok+r.d.bad)+')'}</span></div>`});
h+='</div>';const weak=rows.filter(r=>r.a!==null&&r.d.ok+r.d.bad>=3&&r.a<60).sort((a,b)=>a.a-b.a);
h+='<h2>На что обратить внимание</h2><div class="card">'+(weak.length?weak.map(r=>`<div class="rb"><span style="width:auto;flex:1">⚠️ ${r.t.n} — ${r.a}%</span><button onclick="start('topic','${r.t.id}')">Тренировать</button></div>`).join(''):'<span class="m">Слабых тем пока нет (нужно хотя бы 3 ответа по теме и точность ниже 60%).</span>')+'</div>';
const best=rows.filter(r=>r.a!==null&&r.d.ok+r.d.bad>=3&&r.a>=80);if(best.length)h+=`<p class="m">💪 Сильные темы: ${best.map(r=>r.t.n).join(', ')}</p>`;
if(ST.h.length){const l=ST.h.slice(-12);h+='<h2>Динамика по занятиям</h2><div class="card"><div class="ch">'+l.map(s=>{const q=Math.round(s.ok/s.n*100);return`<div title="${q}%" style="height:${Math.max(q,3)}%;background:${col(q)}"></div>`}).join('')+`</div><div class="m" style="font-size:.8rem">Последние ${l.length} занятий (слева — старые). Последнее: ${l[l.length-1].ok}/${l[l.length-1].n}, ${new Date(l[l.length-1].ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div></div>`}
h+='<p style="text-align:center"><button class="g" onclick="if(confirm(\'Сбросить всю статистику?\')){ST={t:{},h:[]};save();stats()}">Сбросить статистику</button></p>';
$('#app').innerHTML=h}
home();
</script></body></html>
